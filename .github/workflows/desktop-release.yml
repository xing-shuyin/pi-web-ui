name: Desktop installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: native/device-p2p/go.sum

      # 桌面安装包不带助手时 P2P 永远退回 Hub 中继，且界面上看不出来（只有一行 server 日志）。
      - name: Build P2P helper for this platform
        run: npm run build:device-p2p -- --host

      - name: Build native desktop encoder and relink materials
        run: npm run build:desktop-codec

      - name: Fetch ffmpeg for the H.264 desktop channel (Windows only)
        run: npm run build:ffmpeg

      - name: Verify native desktop package assets
        run: npm run verify:desktop-codec

      - name: Build (web + server)
        run: npm run build

      - name: Build desktop shell
        run: npm run build:desktop

      - name: Package Windows installer
        run: npx electron-builder -c desktop/electron-builder.yml --win --publish never

      - name: Package Windows portable edition (with built-in kernel, Git & Node.js)
        shell: bash
        run: node scripts/make-portable.mjs --zip --with-git --with-node

      # 壳 + 运行时双层模型：从便携版的完整 app 目录里把「会变的那层」单独打成运行时归档并签名。
      # 没有 DESKTOP_RUNTIME_SIGNING_KEY（fork / 未配 secret）就跳过，不阻塞安装包发布。
      - name: Build runtime artifacts (shell + runtime)
        shell: bash
        env:
          DESKTOP_RUNTIME_SIGNING_KEY: ${{ secrets.DESKTOP_RUNTIME_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_RUNTIME_SIGNING_KEY:-}" ]; then
            echo "::warning::没有 DESKTOP_RUNTIME_SIGNING_KEY，跳过运行时产物"
            exit 0
          fi
          APP=$(ls -d release-portable/win-unpacked/resources/app | head -n1)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          node scripts/build-desktop-runtime.mjs --platform win32 --arch x64 --from "$APP" --out release/runtime --base-url "$BASE"
          node scripts/verify-desktop-runtime.mjs             --manifest release/runtime/runtime-win32-x64.json             --signature release/runtime/runtime-win32-x64.sig             --public-key release/runtime/runtime-win32-x64.pub.pem             --archive release/runtime/core-*-win32-x64.tar.zst

      - name: Upload unsigned installer for signing
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-win-installer
          path: release/*.exe
          retention-days: 1

      - name: Sign Windows installer with SignPath
        id: signpath
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: "3de26332-3db9-4d2a-b7cd-33ca0c263a6e"
          project-slug: "pi-web-ui"
          signing-policy-slug: "test-signing"
          artifact-configuration-slug: "initial"
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: release-signed

      - name: Replace installer with signed binary and refresh release metadata
        if: steps.signpath.outcome == 'success'
        shell: bash
        run: |
          cp -f release-signed/*.exe release/
          node scripts/refresh-win-release-metadata.mjs

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-ui-desktop-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/*-portable.zip
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # release-notes.yml 并行跑，等 Release 建出来（最多 3 分钟）再挂资产
          for _ in $(seq 1 36); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "waiting for release $TAG …"
            sleep 5
          done
          gh release view "$TAG" >/dev/null
          ASSETS=()
          shopt -s nullglob
          for f in release/*.exe release/*.exe.blockmap release/latest.yml release/*-portable.zip release/runtime/*; do
            if [ -f "$f" ]; then ASSETS+=("$f"); fi
          done
          printf 'uploading: %s\n' "${ASSETS[@]}"
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

  macos-installer:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: native/device-p2p/go.sum

      - name: Build P2P helper for this platform
        run: npm run build:device-p2p -- --host

      - name: Build (web + server)
        run: npm run build

      - name: Build desktop shell
        run: npm run build:desktop

      - name: Package macOS app (dmg + zip)
        run: npx electron-builder -c desktop/electron-builder.yml --mac --publish never

      - name: Build runtime artifacts (shell + runtime)
        shell: bash
        env:
          DESKTOP_RUNTIME_SIGNING_KEY: ${{ secrets.DESKTOP_RUNTIME_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_RUNTIME_SIGNING_KEY:-}" ]; then
            echo "::warning::没有 DESKTOP_RUNTIME_SIGNING_KEY，跳过运行时产物"
            exit 0
          fi
          case "$(uname -m)" in arm64|aarch64) ARCH=arm64 ;; *) ARCH=x64 ;; esac
          APP=$(ls -d release/mac*/keel.app/Contents/Resources/app | head -n1)
          if [ ! -d "$APP/dist/server" ]; then
            echo "shell-only package without built-in kernel, skipping runtime artifacts"
            exit 0
          fi
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          node scripts/build-desktop-runtime.mjs --platform darwin --arch "$ARCH" --from "$APP" --out release/runtime --base-url "$BASE"
          node scripts/verify-desktop-runtime.mjs             --manifest "release/runtime/runtime-darwin-$ARCH.json"             --signature "release/runtime/runtime-darwin-$ARCH.sig"             --public-key "release/runtime/runtime-darwin-$ARCH.pub.pem"             --archive "release/runtime/core-*-darwin-$ARCH.tar.zst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-ui-desktop-macos
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          for _ in $(seq 1 36); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          gh release view "$TAG" >/dev/null
          ASSETS=()
          shopt -s nullglob
          for f in release/*.dmg release/*.zip release/latest-mac.yml release/runtime/*; do
            if [ -f "$f" ]; then ASSETS+=("$f"); fi
          done
          printf 'uploading: %s\n' "${ASSETS[@]}"
          gh release upload "$TAG" "${ASSETS[@]}" --clobber

  linux-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: native/device-p2p/go.sum

      - name: Build P2P helper for this platform
        run: npm run build:device-p2p -- --host

      - name: Build (web + server)
        run: npm run build

      - name: Build desktop shell
        run: npm run build:desktop

      - name: Package Linux AppImage
        run: npx electron-builder -c desktop/electron-builder.yml --linux AppImage --publish never

      - name: Build runtime artifacts (shell + runtime)
        shell: bash
        env:
          DESKTOP_RUNTIME_SIGNING_KEY: ${{ secrets.DESKTOP_RUNTIME_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_RUNTIME_SIGNING_KEY:-}" ]; then
            echo "::warning::没有 DESKTOP_RUNTIME_SIGNING_KEY，跳过运行时产物"
            exit 0
          fi
          APP=$(ls -d release/linux-unpacked/resources/app | head -n1)
          if [ ! -d "$APP/dist/server" ]; then
            echo "shell-only package without built-in kernel, skipping runtime artifacts"
            exit 0
          fi
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          node scripts/build-desktop-runtime.mjs --platform linux --arch x64 --from "$APP" --out release/runtime --base-url "$BASE"
          node scripts/verify-desktop-runtime.mjs             --manifest release/runtime/runtime-linux-x64.json             --signature release/runtime/runtime-linux-x64.sig             --public-key release/runtime/runtime-linux-x64.pub.pem             --archive release/runtime/core-*-linux-x64.tar.zst

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-ui-desktop-linux
          path: |
            release/*.AppImage
            release/*.blockmap
            release/latest-linux.yml
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          for _ in $(seq 1 36); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            sleep 5
          done
          gh release view "$TAG" >/dev/null
          ASSETS=()
          shopt -s nullglob
          for f in release/*.AppImage release/*.blockmap release/latest-linux.yml release/runtime/*; do
            if [ -f "$f" ]; then ASSETS+=("$f"); fi
          done
          printf 'uploading: %s\n' "${ASSETS[@]}"
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
