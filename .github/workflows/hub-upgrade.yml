name: Hub release upgrade acceptance

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Published baseline package, e.g. pi-web-ui@0.117.0
        default: pi-web-ui@latest
        type: string
  pull_request:
    paths:
      - "bin/**"
      - "server/device-center/**"
      - "server/pkg-info.ts"
      - "web/src/components/DeviceCenter.tsx"
      - "web/src/hub-upgrade.ts"
      - "tests/hub-upgrade-release-test.mjs"
      - "scripts/prepare-hub-release.mjs"
      - "package*.json"
      - ".github/workflows/hub-upgrade.yml"
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "server/device-center/**"
      - "package*.json"
      - ".github/workflows/hub-upgrade.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir release-candidate && npm pack --ignore-scripts --pack-destination release-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: hub-release-candidate
          path: release-candidate/*.tgz
          if-no-files-found: error

  service-upgrade:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: hub-release-candidate
          path: release-candidate
      - run: npx playwright-core install chromium --with-deps
      - name: Prepare Linux user service session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          sudo systemctl start "user@$(id -u).service"
      - name: Exercise published baseline, browser update, package failure and real rollback
        shell: bash
        env:
          HUB_TEST_BASELINE: ${{ inputs.baseline || 'pi-web-ui@latest' }}
        run: |
          candidate=(release-candidate/*.tgz)
          node tests/hub-upgrade-release-test.mjs --candidate "${candidate[0]}" --baseline "$HUB_TEST_BASELINE" --output hub-upgrade-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-upgrade-${{ matrix.os }}-node${{ matrix.node }}
          path: hub-upgrade-results/
          if-no-files-found: warn
