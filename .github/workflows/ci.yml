name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 16 * * *"

# 同一分支的新推送取消上一轮在跑的检查：连续 push 时不再排队跑过期提交。
# 不取消 main 上的推送（那是在验证已合并的代码）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 静态检查 + 构建：全部是秒级步骤，合成一个 job 免得反复装依赖。
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            plugins/vscode-editor/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix mobile ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check protocol sync
        run: node scripts/check-protocol-sync.mjs

      - name: Check locale packs
        run: npm run i18n:check

      - name: Typecheck
        run: |
          npm run typecheck
          npm --prefix mobile run typecheck

      - name: Build
        run: npm run build

      - name: Check committed plugin bundles are up to date
        run: |
          (cd plugins/vscode-editor && npm ci --no-audit --no-fund && node build.mjs)
          (cd plugins/db-client && node build.mjs)
          git diff --exit-code -- \
            plugins/db-client/client/entry.mjs \
            plugins/vscode-editor/client/entry.mjs \
            plugins/mermaid/client/vendor \
            plugins/run-trace/client/vendor

      - name: Build browser extension
        run: npm run build:extension

      - name: Pack browser extension (自校验 zip)
        run: npm run pack:extension

  # 单测分片：1047 个文件 / 12000+ 条，单机跑要 6.5 分钟，是整条流水线的瓶颈。
  # 4 片各跑一个 4 核 runner，壁钟降到 ~1/4；`--shard` 由 vitest 按文件切分。
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 一片红不要连坐取消其他片：并行跑完才能一次看全所有失败。
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      # mobile 依赖也要装：分片后 shard 3 里有 mobile-connections /
      # mobile-push-controller 两条用例 import mobile/src/*，缺 @capacitor/core、
      # @pi-mobile/native-local-engine 会直接 "Cannot find package"。
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix mobile ci --no-audit --no-fund

      # atomic-file-generated 的逐字节比对需要在场时才有 dist 可比；顺带覆盖其他读 dist 的用例。
      - name: Build server
        run: npm run build:server

      - name: Unit tests (shard ${{ matrix.shard }}/4)
        run: npx vitest run --shard=${{ matrix.shard }}/4

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build server
        run: npm run build:server

      - name: Integration tests (真 git / 真子进程 / 真 Hub)
        run: npm run test:integration

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Protocol smoke tests (core, PR fast gate)
        if: github.event_name == 'pull_request'
        env:
          PI_WEB_PLUGIN_CATALOG_URL: ""
        run: node tests/run-smoke.mjs --core --retry-once --jobs=4 --no-build

      - name: Protocol smoke tests (full)
        if: github.event_name != 'pull_request'
        env:
          PI_WEB_PLUGIN_CATALOG_URL: ""
        run: node tests/run-smoke.mjs --retry-once --jobs=4 --no-build
