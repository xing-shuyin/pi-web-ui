name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 全量冒烟 nightly（北京时间午夜）：PR 只跑 --core 快检，慢/重测试由这里兜底。
  schedule:
    - cron: "0 16 * * *"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          # 两个锁文件都要缓存：下面的「插件 bundle 新鲜度」守卫会在 plugins/vscode-editor
          # 里跑它自己的 `npm ci`（那个包有自己的 66 个依赖 + 自己的 esbuild）。
          cache-dependency-path: |
            package-lock.json
            plugins/vscode-editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 代码格式（prettier；失败先修格式：npm run format）
      - name: Check formatting
        run: npm run format:check

      # 静态检查（oxlint；失败先看报告：npm run lint）
      - name: Lint
        run: npm run lint

      # 协议双端手工同步校验（server/protocol.ts ↔ web/src/types.ts）
      - name: Check protocol sync
        run: node scripts/check-protocol-sync.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 入库的构建产物必须与 src/ 同步：改了插件 src/ 却忘了重新生成 bundle，这里直接红。
      # · mermaid / run-trace 的 vendor bundle 已由上面的 `npm run build` 生成，直接校验；
      # · db-client 的 bundle 无第三方依赖，用根依赖里的 esbuild 就能打；
      # · vscode-editor 的 bundle 要**它自己的** 66 个包（CodeMirror / xterm / 自己锁定的
      #   esbuild，见该目录 package.json），所以先在里面 `npm ci`；
      # · legado-web 的 app 构建成本更高（整棵 Vite 前端 + 它自己的 node_modules），不在守卫范围。
      # 两个 build.mjs 的 entryPoints/outfile 都是**相对 cwd** 的（无 absWorkingDir），
      # 必须在各自插件目录里跑 —— 在仓库根跑会报 `Could not resolve "src/client.js"`。
      - name: Check committed plugin bundles are up to date
        run: |
          (cd plugins/vscode-editor && npm ci --no-audit --no-fund && node build.mjs)
          (cd plugins/db-client && node build.mjs)
          git diff --exit-code -- \
            plugins/db-client/client/entry.mjs \
            plugins/vscode-editor/client/entry.mjs \
            plugins/mermaid/client/vendor \
            plugins/run-trace/client/vendor

      # 浏览器扩展打包（esbuild；语法/入口问题在 PR 阶段就暴露）
      - name: Build browser extension
        run: npm run build:extension

      - name: Pack browser extension (自校验 zip)
        run: npm run pack:extension

      # 纯函数单测（毫秒级、零 token）
      - name: Unit tests
        run: npx vitest run

      # 零 token 协议冒烟（每个测试自起隔离 server：独立端口 + 临时 data-dir）
      # 分层：PR 跑 --core 快检（~20 个，2~4 分钟），push main / nightly 跑全量（~70 个）。
      - name: Protocol smoke tests (core, PR fast gate)
        if: github.event_name == 'pull_request'
        env:
          PI_WEB_PLUGIN_CATALOG_URL: ""
        run: node tests/run-smoke.mjs --core --retry-once --jobs=4

      - name: Protocol smoke tests (full)
        if: github.event_name != 'pull_request'
        env:
          PI_WEB_PLUGIN_CATALOG_URL: ""
        run: node tests/run-smoke.mjs --retry-once --jobs=4
