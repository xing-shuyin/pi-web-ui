appId: com.xingshuyin.pi-web-ui-desktop
productName: pi-web-ui-desktop
directories:
  output: release
files:
  - bin
  - dist/desktop
  - dist/browser
  - dist/server
  - web/dist
  - themes
  - plugin-sdk
  - plugins/catalog.json
  - docs/architecture-plugins.md
  - package.json
  # 桌面主进程 requires 它（内部用 debug/ms），不进打包名单就会在安装版里 MODULE_NOT_FOUND
  - node_modules/electron-chrome-extensions/**
  - node_modules/debug/**
  - node_modules/ms/**
  # TOTP 验证器的扫码解码（browser/runtime/qr.ts 顶层 import）：漏了安装版主进程直接 MODULE_NOT_FOUND
  - node_modules/jsqr/**
extraMetadata:
  main: dist/desktop/main.js
asar: false
npmRebuild: false
publish:
  provider: github
  owner: xing-shuyin
  repo: pi-web-ui
win:
  target:
    - nsis
    - dir
  icon: web/public/icons/icon-1024.png
mac:
  target:
    - dmg
    - zip
  icon: web/public/icons/icon-1024.png
linux:
  target: AppImage
  icon: web/public/icons/icon-1024.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
