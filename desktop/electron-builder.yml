# 桌面端标准安装包（纯壳包）：只放壳，内核由全局 keel（keel-agent）提供；
# 本机未安装 Node / keel 时，由壳的启动覆盖层提示安装相关环境。
# 便携版需内置完整内核，请使用 `desktop/electron-builder.portable.yml`（`npm run desktop:portable`）。
appId: com.xingshuyin.keel
productName: keel
directories:
  output: release
files:
  # 壳自己的代码 + 内置浏览器 UI + 三进程根共用的 dist/shared + 壳声明
  - dist/desktop
  - dist/browser
  - dist/shared
  - package.json
  # 关键（两个坑都要显式踩住）：
  # 1. electron-builder 会按 package.json 的 `dependencies` **自动收全部生产依赖**，
  #    只靠“不写”排不掉（实测：不取反时 node-pty/ffmpeg/device-p2p 照样进包，760 MB）。
  # 2. 先全量取反内核目录与 node_modules，再把壳真正需要的模块和依赖放回来。
  - "!node_modules/**/*"
  - "!bin"
  - "!dist/server"
  - "!dist/packages"
  # 例外：壳自己要用到的纯工具模块（CLI 启动链、web-build 验收等），由 desktop-shell-closure 单测守卫。
  - dist/server/command-spawn.js
  - dist/server/engine-catalog.js
  - dist/server/engine-cli.js
  - dist/server/global-loader.js
  - dist/server/native-cli-discovery.js
  - dist/server/process-utils.js
  - dist/server/run-process.js
  - dist/server/web-build.js
  - dist/packages/keel/src/engine-catalog.js
  - "!web/dist"
  - "!themes"
  - "!plugin-sdk"
  - "!plugins/catalog.json"
  - "!docs/architecture-plugins.md"
  # >>> shell-deps（由 scripts/gen-shell-deps.mjs 生成，勿手改）
  # 内容 = 壳源码的 import 闭包 + 这些包的传递依赖；改了壳的 import 就重跑生成器。
  - node_modules/@isaacs/fs-minipass/**
  - node_modules/argparse/**
  - node_modules/builder-util-runtime/**
  - node_modules/chownr/**
  - node_modules/debug/**
  - node_modules/electron-chrome-extensions/**
  - node_modules/electron-updater/**
  - node_modules/fs-extra/**
  - node_modules/graceful-fs/**
  - node_modules/js-yaml/**
  - node_modules/jsonfile/**
  - node_modules/jsqr/**
  - node_modules/lazy-val/**
  - node_modules/lodash.escaperegexp/**
  - node_modules/lodash.isequal/**
  - node_modules/minipass/**
  - node_modules/minizlib/**
  - node_modules/ms/**
  - node_modules/pend/**
  - node_modules/sax/**
  - node_modules/tar/**
  - node_modules/tiny-typed-emitter/**
  - node_modules/universalify/**
  - node_modules/yauzl/**
  # <<< shell-deps
extraMetadata:
  main: dist/desktop/main.js
asar: true
# 没有原生件可解包：node-pty 属于内核（全局 keel 运行时），壳不需要它
asarUnpack: []
npmRebuild: false
afterPack: scripts/mac-after-sign.mjs
publish:
  provider: github
  owner: xing-shuyin
  repo: pi-web-ui
win:
  target:
    - nsis
    - dir
  icon: web/public/icons/icon-1024.png
mac:
  target:
    - dmg
    - zip
  icon: web/public/icons/icon-1024.png
linux:
  target: AppImage
  icon: web/public/icons/icon-1024.png
nsis:
  # 安装器必须提权（实测：非提权启动会拿到低完整性令牌，安装目录不可写）
  perMachine: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
  # 安装/卸载前先清场：关掉旧版主进程 + 命令行指向安装目录的 node 侧车
  include: desktop/installer.nsh
msi:
  artifactName: keel-${version}-win-${arch}.${ext}
  warningsAsErrors: false
