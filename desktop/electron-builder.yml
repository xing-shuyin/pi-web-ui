appId: com.xingshuyin.pi-web-ui-desktop
productName: pi-web-ui-desktop
directories:
  output: release
files:
  - bin
  - dist/desktop
  - dist/browser
  - dist/server
  - web/dist
  - themes
  - plugin-sdk
  - plugins/catalog.json
  - docs/architecture-plugins.md
  - package.json
extraMetadata:
  main: dist/desktop/main.js
asar: false
npmRebuild: false
publish:
  provider: github
  owner: xing-shuyin
  repo: pi-web-ui
win:
  target:
    - nsis
    - dir
  icon: web/public/icons/icon-1024.png
mac:
  target:
    - dmg
    - zip
  icon: web/public/icons/icon-1024.png
linux:
  target: AppImage
  icon: web/public/icons/icon-1024.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
