# 纯壳包独立输出别名（兼容 `npm run desktop:nsis:shell`）：
# 主配置 `desktop/electron-builder.yml` 本身已是纯壳包，这里只覆盖输出目录与产物名，避免与主通道碰撞。
extends: desktop/electron-builder.yml

directories:
  output: release-shell

nsis:
  perMachine: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-shell-${version}-setup.${ext}
  include: desktop/installer.nsh

# 独立别名通道不参与自更新：NSIS 的 latest.yml 只由主通道发布。
publish: null
