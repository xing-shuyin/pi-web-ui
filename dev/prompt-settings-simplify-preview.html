<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>系统提示词页 · 精简方案 A/B/C — pi-web-ui</title>
		<style>
			:root {
				--bg: #0a0c10;
				--panel: #11141b;
				--panel-2: #161a23;
				--panel-3: #1b2029;
				--line: rgba(255, 255, 255, 0.07);
				--line-2: rgba(255, 255, 255, 0.12);
				--text: #e9ecf3;
				--muted: #98a1b3;
				--faint: #6d7688;
				--accent: #34d399;
				--accent-soft: rgba(52, 211, 153, 0.13);
				--accent-line: rgba(52, 211, 153, 0.38);
				--font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
					"Microsoft YaHei", "Noto Sans JP", Roboto, sans-serif;
				--mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			}
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				background: radial-gradient(1200px 600px at 50% -10%, #12161f 0%, var(--bg) 55%);
				color: var(--text);
				font-family: var(--font);
				font-size: 14px;
				line-height: 1.5;
				-webkit-font-smoothing: antialiased;
				padding: 34px 28px 90px;
			}
			.wrap {
				max-width: 1240px;
				margin: 0 auto;
			}

			/* ---------- 展示页头部 ---------- */
			.show-head {
				display: flex;
				flex-direction: column;
				gap: 10px;
				padding-bottom: 22px;
				border-bottom: 1px solid var(--line);
				margin-bottom: 14px;
			}
			.show-head h1 {
				font-size: 22px;
				font-weight: 650;
				letter-spacing: -0.015em;
			}
			.show-head p {
				color: var(--muted);
				font-size: 13px;
				max-width: 800px;
			}
			.show-head .tag-list {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				margin-top: 4px;
			}
			.tag {
				font-size: 11.5px;
				color: var(--muted);
				border: 1px solid var(--line-2);
				border-radius: 999px;
				padding: 3px 10px;
				background: rgba(255, 255, 255, 0.02);
			}
			.topbar {
				position: sticky;
				top: 0;
				z-index: 20;
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 10px 0;
				margin-bottom: 18px;
				background: linear-gradient(to bottom, rgba(10, 12, 16, 0.97) 72%, rgba(10, 12, 16, 0));
				backdrop-filter: blur(6px);
			}
			.tabs {
				display: flex;
				gap: 6px;
				flex-wrap: wrap;
				min-width: 0;
			}
			.tabs button,
			.langs button {
				font: inherit;
				font-size: 13px;
				color: var(--muted);
				background: transparent;
				border: 1px solid transparent;
				border-radius: 9px;
				padding: 7px 13px;
				cursor: pointer;
				transition: all 0.16s ease;
				white-space: nowrap;
			}
			.tabs button:hover,
			.langs button:hover {
				color: var(--text);
				background: rgba(255, 255, 255, 0.04);
			}
			.tabs button[aria-selected="true"] {
				color: var(--text);
				background: var(--panel-2);
				border-color: var(--line-2);
			}
			.tabs button b {
				font-weight: 600;
				color: var(--accent);
				margin-right: 6px;
			}
			.langs {
				margin-left: auto;
				display: flex;
				gap: 2px;
				padding: 2px;
				border: 1px solid var(--line);
				border-radius: 11px;
				background: rgba(255, 255, 255, 0.02);
			}
			.langs button {
				font-size: 12px;
				padding: 5px 11px;
				border-radius: 8px;
			}
			.langs button[aria-pressed="true"] {
				color: var(--text);
				background: var(--panel-3);
				box-shadow: 0 0 0 1px var(--line-2) inset;
			}

			/* ---------- 方案容器 ---------- */
			.scheme {
				--accent: #34d399;
				--accent-soft: rgba(52, 211, 153, 0.13);
				--accent-line: rgba(52, 211, 153, 0.38);
				display: none;
				flex-direction: column;
				gap: 18px;
			}
			.scheme.on {
				display: flex;
			}
			.scheme[data-scheme="b"] {
				--accent: #8b8cf9;
				--accent-soft: rgba(139, 140, 249, 0.14);
				--accent-line: rgba(139, 140, 249, 0.4);
			}
			.scheme[data-scheme="c"] {
				--accent: #38bdf8;
				--accent-soft: rgba(56, 189, 248, 0.13);
				--accent-line: rgba(56, 189, 248, 0.4);
			}
			.scheme-head {
				display: flex;
				flex-wrap: wrap;
				align-items: baseline;
				gap: 10px 14px;
			}
			.scheme-head h2 {
				font-size: 17px;
				font-weight: 620;
				letter-spacing: -0.01em;
			}
			.scheme-head h2 .num {
				color: var(--accent);
				margin-right: 8px;
			}
			.scheme-head p {
				color: var(--muted);
				font-size: 12.5px;
				flex: 1 1 420px;
				min-width: 0;
			}

			/* ---------- 模拟窗口 ---------- */
			.mock {
				border: 1px solid var(--line-2);
				border-radius: 16px;
				background: linear-gradient(180deg, #14181f 0%, #0e1116 100%);
				box-shadow:
					0 40px 80px -32px rgba(0, 0, 0, 0.9),
					0 0 0 1px rgba(0, 0, 0, 0.4);
				overflow: hidden;
			}
			.mock-bar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				padding: 11px 16px;
				border-bottom: 1px solid var(--line);
				background: rgba(255, 255, 255, 0.02);
			}
			.mock-bar .left,
			.mock-bar .right {
				display: flex;
				align-items: center;
				gap: 10px;
				min-width: 0;
			}
			.mock-bar .crumb {
				color: var(--faint);
				font-size: 12.5px;
				white-space: nowrap;
			}
			.mock-bar .crumb b {
				color: var(--text);
				font-weight: 500;
			}
			.save-pill {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				font-size: 11.5px;
				color: var(--accent);
				background: var(--accent-soft);
				border: 1px solid var(--accent-line);
				border-radius: 999px;
				padding: 2px 9px;
				white-space: nowrap;
			}
			.close-x {
				color: var(--faint);
				font-size: 15px;
				line-height: 1;
				padding: 2px 4px;
			}
			.mock-body {
				display: grid;
				grid-template-columns: 176px minmax(0, 1fr);
				min-height: 560px;
			}
			.mock-body.wide {
				grid-template-columns: 64px minmax(0, 1fr) 292px;
			}
			.mock-nav {
				border-right: 1px solid var(--line);
				padding: 14px 10px;
				display: flex;
				flex-direction: column;
				gap: 2px;
				background: rgba(0, 0, 0, 0.16);
			}
			.nav-label {
				font-size: 10.5px;
				letter-spacing: 0.09em;
				color: var(--faint);
				padding: 8px 10px 6px;
			}
			.nav-item {
				display: flex;
				align-items: center;
				gap: 9px;
				font-size: 12.5px;
				color: var(--muted);
				padding: 7px 10px;
				border-radius: 8px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.nav-item .ico {
				width: 15px;
				text-align: center;
				opacity: 0.7;
				font-size: 12px;
				flex: none;
			}
			.nav-item.active {
				color: var(--text);
				background: var(--panel-3);
				box-shadow: 0 0 0 1px var(--line-2) inset;
			}
			.nav-item .pill {
				margin-left: auto;
				font-size: 10.5px;
				color: var(--faint);
			}
			.mock-nav.rail {
				align-items: center;
				padding: 14px 0;
				gap: 6px;
			}
			.mock-nav.rail .rail-ico {
				width: 34px;
				height: 34px;
				display: grid;
				place-items: center;
				border-radius: 9px;
				color: var(--muted);
				font-size: 14px;
			}
			.mock-nav.rail .rail-ico.active {
				color: var(--accent);
				background: var(--accent-soft);
				box-shadow: 0 0 0 1px var(--accent-line) inset;
			}
			.mock-nav.rail .rail-gap {
				height: 8px;
			}

			/* ---------- 内容列 ---------- */
			.pane {
				padding: 20px 22px 24px;
				display: flex;
				flex-direction: column;
				gap: 16px;
				min-width: 0;
			}
			.pane-head {
				display: flex;
				align-items: flex-start;
				gap: 14px;
			}
			.pane-head .txt {
				flex: 1;
				min-width: 0;
			}
			.pane-head h3 {
				font-size: 15.5px;
				font-weight: 620;
				letter-spacing: -0.01em;
			}
			.pane-head p {
				color: var(--muted);
				font-size: 12.5px;
				margin-top: 4px;
				max-width: 520px;
			}
			.pane-actions {
				display: flex;
				gap: 8px;
				flex: none;
			}
			.ghost {
				font: inherit;
				font-size: 12px;
				color: var(--muted);
				background: rgba(255, 255, 255, 0.03);
				border: 1px solid var(--line-2);
				border-radius: 8px;
				padding: 6px 11px;
				cursor: pointer;
				white-space: nowrap;
				transition: 0.15s ease;
			}
			.ghost:hover {
				color: var(--text);
				border-color: rgba(255, 255, 255, 0.22);
				background: rgba(255, 255, 255, 0.06);
			}
			.link {
				font: inherit;
				font-size: 12px;
				color: var(--muted);
				background: none;
				border: 0;
				cursor: pointer;
				padding: 0;
				white-space: nowrap;
			}
			.link:hover {
				color: var(--accent);
				text-decoration: underline;
				text-underline-offset: 3px;
			}
			.card {
				border: 1px solid var(--line);
				border-radius: 13px;
				background: var(--panel);
				overflow: hidden;
			}
			.card-head {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 12px 14px;
				border-bottom: 1px solid var(--line);
			}
			.card-head .title {
				color: var(--text);
				font-size: 12.5px;
				font-weight: 560;
				white-space: nowrap;
			}
			.label {
				font-size: 11px;
				letter-spacing: 0.08em;
				color: var(--muted);
				white-space: nowrap;
			}
			.count {
				font-size: 11.5px;
				color: var(--faint);
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
			}
			.card-head .spacer,
			.editor-foot .spacer,
			.pcard-foot .spacer,
			.total-bar .spacer {
				flex: 1;
			}

			/* 开关 */
			.sw {
				flex: none;
				width: 36px;
				height: 20px;
				border-radius: 999px;
				border: 1px solid var(--line-2);
				background: rgba(255, 255, 255, 0.06);
				position: relative;
				cursor: pointer;
				transition: 0.18s ease;
				padding: 0;
			}
			.sw i {
				position: absolute;
				top: 2px;
				left: 2px;
				width: 14px;
				height: 14px;
				border-radius: 50%;
				background: #cfd6e4;
				transition: 0.18s cubic-bezier(0.4, 0.9, 0.3, 1);
				display: block;
			}
			.sw[aria-checked="true"] {
				background: var(--accent);
				border-color: transparent;
			}
			.sw[aria-checked="true"] i {
				left: 18px;
				background: #08120f;
			}

			/* ---------- 方案 A：清单 ---------- */
			.rows {
				list-style: none;
			}
			.entry + .entry {
				border-top: 1px solid var(--line);
			}
			.row {
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 11px 14px;
				transition: background 0.14s ease;
			}
			.row:hover {
				background: rgba(255, 255, 255, 0.025);
			}
			.entry.open .row {
				background: rgba(255, 255, 255, 0.03);
			}
			.row-main {
				flex: 1;
				min-width: 0;
				display: flex;
				align-items: baseline;
				gap: 10px;
				text-align: left;
				background: none;
				border: 0;
				font: inherit;
				color: inherit;
				cursor: pointer;
				padding: 0;
				overflow: hidden;
			}
			.row-name {
				font-size: 13.5px;
				font-weight: 500;
				white-space: nowrap;
				flex: none;
			}
			.row-desc {
				font-size: 12px;
				color: var(--faint);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				min-width: 0;
			}
			.row-meta {
				font-size: 11.5px;
				color: var(--faint);
				font-variant-numeric: tabular-nums;
				flex: none;
			}
			.row-flag {
				font-size: 10.5px;
				color: var(--accent);
				background: var(--accent-soft);
				border-radius: 5px;
				padding: 1px 6px;
				flex: none;
				white-space: nowrap;
			}
			.chev {
				color: var(--faint);
				font-size: 10px;
				transition: transform 0.18s ease;
				flex: none;
				width: 14px;
				text-align: center;
			}
			.entry.open .chev {
				transform: rotate(180deg);
				color: var(--accent);
			}
			.entry.off .row-name,
			.entry.off .row-desc {
				opacity: 0.45;
			}
			/* 展开区铺满整行：左右无留白，输入框自身留内边距 */
			.editor {
				display: none;
				padding: 0;
				background: rgba(255, 255, 255, 0.02);
			}
			.entry.open .editor {
				display: block;
			}
			.editor > .editor-label {
				margin: 0;
				padding: 10px 14px 8px;
			}
			.editor textarea {
				display: block;
				min-height: 96px;
				padding: 10px 14px;
				border-width: 1px 0;
				border-radius: 0;
			}
			.editor textarea:focus {
				border-color: var(--accent-line);
				box-shadow: inset 0 0 0 1px var(--accent-line);
			}
			.editor .editor-foot {
				margin-top: 0;
				padding: 9px 14px 12px;
			}
			.editor-label {
				display: flex;
				align-items: baseline;
				gap: 8px;
				font-size: 11.5px;
				color: var(--muted);
				margin: 6px 0 7px;
				flex-wrap: wrap;
			}
			.editor-label em {
				font-style: normal;
				color: var(--faint);
			}
			textarea {
				width: 100%;
				resize: vertical;
				min-height: 84px;
				font-family: var(--font);
				font-size: 12.5px;
				line-height: 1.65;
				color: var(--text);
				background: #0b0e13;
				border: 1px solid var(--line-2);
				border-radius: 9px;
				padding: 10px 12px;
				outline: none;
				transition:
					border-color 0.15s ease,
					box-shadow 0.15s ease;
			}
			textarea::placeholder {
				color: #556;
			}
			textarea:focus {
				border-color: var(--accent-line);
				box-shadow: 0 0 0 3px var(--accent-soft);
			}
			.editor-foot {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-top: 8px;
				font-size: 11.5px;
				color: var(--faint);
				flex-wrap: wrap;
			}
			.advanced {
				border: 1px dashed var(--line-2);
				border-radius: 11px;
				padding: 11px 14px;
				color: var(--muted);
				font-size: 12px;
				background: rgba(255, 255, 255, 0.015);
			}
			.advanced summary {
				cursor: pointer;
				list-style: none;
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.advanced summary::-webkit-details-marker {
				display: none;
			}
			.advanced summary::before {
				content: "▸";
				color: var(--faint);
				font-size: 10px;
				flex: none;
			}
			.advanced[open] summary::before {
				content: "▾";
			}
			.advanced p {
				margin: 9px 0 0 18px;
				color: var(--faint);
				font-size: 11.5px;
			}
			.order-strip {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 6px;
			}
			.order-strip .chip {
				font-size: 11.5px;
				color: var(--muted);
				background: rgba(255, 255, 255, 0.04);
				border: 1px solid var(--line);
				border-radius: 7px;
				padding: 3px 8px;
			}
			.order-strip .chip.off {
				opacity: 0.4;
				text-decoration: line-through;
			}
			.order-strip .arrow {
				color: var(--faint);
				font-size: 10px;
			}

			/* ---------- 方案 B：分组卡片 ---------- */
			.group {
				display: flex;
				flex-direction: column;
				gap: 9px;
			}
			.group-head {
				display: flex;
				align-items: baseline;
				gap: 10px;
				flex-wrap: wrap;
			}
			.group-head .title {
				color: var(--text);
				font-size: 12.5px;
				font-weight: 560;
			}
			.group-head .hint {
				font-size: 11.5px;
				color: var(--faint);
			}
			.grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 10px;
			}
			.pcard {
				border: 1px solid var(--line);
				border-radius: 12px;
				background: var(--panel);
				padding: 12px 13px;
				display: flex;
				flex-direction: column;
				gap: 8px;
				min-width: 0;
				transition:
					border-color 0.16s ease,
					background 0.16s ease;
			}
			.pcard:hover {
				border-color: var(--line-2);
				background: var(--panel-2);
			}
			.pcard.wide {
				grid-column: span 2;
			}
			.pcard-top {
				display: flex;
				align-items: center;
				gap: 9px;
			}
			.pcard-name {
				font-size: 13px;
				font-weight: 530;
				flex: 1;
				min-width: 0;
			}
			.pcard.off .pcard-name,
			.pcard.off .pcard-desc,
			.pcard.off .editor-label {
				opacity: 0.42;
			}
			.pcard-desc {
				font-size: 11.8px;
				color: var(--faint);
			}
			.pcard-foot {
				display: flex;
				align-items: center;
				gap: 8px;
				font-size: 11px;
				color: var(--faint);
				font-variant-numeric: tabular-nums;
			}
			.pcard.auto {
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.022), rgba(255, 255, 255, 0.008));
			}
			.auto-tag {
				font-size: 10px;
				letter-spacing: 0.04em;
				color: var(--faint);
				border: 1px solid var(--line);
				border-radius: 5px;
				padding: 1px 5px;
				white-space: nowrap;
			}
			.pcard textarea {
				min-height: 92px;
			}
			.pcard.wide textarea {
				min-height: 76px;
			}

			/* ---------- 方案 C：流水线 + 检查器 ---------- */
			.recipe {
				display: flex;
				flex-direction: column;
				gap: 4px;
				border: 1px solid var(--line);
				border-radius: 12px;
				background: var(--panel);
				padding: 8px;
			}
			.seg {
				display: grid;
				grid-template-columns: 18px minmax(84px, 1fr) minmax(0, 2fr) 52px 34px;
				align-items: center;
				gap: 10px;
				padding: 7px 9px;
				border-radius: 8px;
				border: 1px solid transparent;
				cursor: pointer;
				transition: 0.14s ease;
			}
			.seg:hover {
				background: rgba(255, 255, 255, 0.03);
			}
			.seg.sel {
				background: var(--accent-soft);
				border-color: var(--accent-line);
			}
			.seg.off {
				opacity: 0.42;
			}
			.seg .idx {
				font-size: 10.5px;

									a.h3,
									a.paneLead,
									`<button class="ghost">${esc(l.common.full)}</button><button class="ghost">${esc(l.common.presetsBtn)} ▾</button>`,
								)}
								<section class="card">
									<div class="card-head">
										<span class="title">${esc(a.cardLabel)}</span>
										<span class="count" data-count>${esc(l.countTpl(onCount(), SRC.length))}</span>
										<span class="spacer"></span>
										<button class="link">${esc(l.common.reorder)}</button>
									</div>
									<ul class="rows">${SRC.map(rowA).join("")}</ul>
								</section>
								${orderStripHTML()}
								<details class="advanced">
									<summary>${esc(a.advSummary)}</summary>
									<p>${esc(a.advNote)}</p>
								</details>
							</div>
						</div>
					</div>
					<div class="notes">${notesHTML("a")}</div>
				</section>`;
			}

			/* ---------- 方案 B ---------- */
			function cardEditB(s, wide) {
				const c = s[state.lang];
				const l = L();
				return `<article class="pcard${wide ? " wide" : ""}${state.on[s.id] ? "" : " off"}" data-id="${s.id}">
					<div class="pcard-top"><span class="pcard-name">${esc(c.name)}</span>${swHTML(s.id)}</div>
					<p class="pcard-desc">${esc(c.desc)}</p>
					<div class="editor-label"><span>${esc(c.editTitle)}</span><em>${esc(c.editHint)}</em></div>
					<textarea spellcheck="false" placeholder="${esc(c.ph || "")}">${esc(c.value || "")}</textarea>
					<div class="pcard-foot"><span>≈${s.weight} tokens</span><span class="spacer"></span><button class="link">${
						s.changed ? esc(l.btn.reset) : esc(l.btn.lookDefault)
					}</button></div>
				</article>`;
			}
			function cardAutoB(s) {
				const c = s[state.lang];
				const l = L();
				return `<article class="pcard auto${state.on[s.id] ? "" : " off"}" data-id="${s.id}">
					<div class="pcard-top"><span class="pcard-name">${esc(c.name)}</span><span class="auto-tag">${esc(l.flag.auto)}</span>${swHTML(s.id)}</div>
					<p class="pcard-desc">${esc(c.desc)}</p>
					<div class="pcard-foot"><span>≈${s.weight} tokens</span><span class="spacer"></span><button class="link">${esc(l.btn.replace)}</button></div>
				</article>`;
			}
			function schemeB() {
				const l = L();
				const b = l.b;
				const edits = SRC.filter((s) => s.kind === "edit");
				const autos = SRC.filter((s) => s.kind === "auto");
				return `<section class="scheme${state.scheme === "b" ? " on" : ""}" data-scheme="b">
					<div class="scheme-head"><h2><span class="num">B</span>${esc(b.title)}</h2><p>${esc(b.lead)}</p></div>
					<div class="mock">
						${mockBarHTML()}
						<div class="mock-body">
							${navHTML()}
							<div class="pane">
								${paneHeadHTML(
									b.h3,
									b.paneLead,
									`<button class="ghost">${esc(l.common.full)}</button><button class="ghost">${esc(l.common.presetsBtn)} ▾</button>`,
								)}
								<div class="group">
									<div class="group-head"><span class="title">${esc(b.yours)}</span><span class="hint">${esc(b.yoursHint)}</span></div>
									<div class="grid">${edits.map((s, i) => cardEditB(s, i === edits.length - 1)).join("")}</div>
								</div>
								<div class="group">
									<div class="group-head"><span class="title">${esc(b.autos)}</span><span class="hint">${esc(b.autosHint)}</span></div>
									<div class="grid">${autos.map(cardAutoB).join("")}</div>
								</div>
								<div class="order-strip">
									<span class="label">${esc(l.a.orderLabel)}</span>
									${SRC.map((s) => `<span class="chip${state.on[s.id] ? "" : " off"}">${esc(s[state.lang].name)}</span>`).join(
										'<span class="arrow">›</span>',
									)}
									<button class="link" style="margin-left: 6px">${esc(l.btn.drag)}</button>
								</div>
							</div>
						</div>
					</div>
					<div class="notes">${notesHTML("b")}</div>
				</section>`;
			}

			/* ---------- 方案 C ---------- */
			function segHTML(s, idx) {
				const c = s[state.lang];
				const on = state.on[s.id];
				return `<div class="seg${on ? "" : " off"}${s.kind === "auto" ? " auto" : ""}${
					state.sel === s.id ? " sel" : ""
				}" data-id="${s.id}">
					<span class="idx">${idx + 1}</span>
					<span class="nm">${esc(c.name)}</span>
					<span class="bar"><i style="width:${on ? s.w : 2}%"></i></span>
					<span class="tk">${s.weight}</span>
					${swHTML(s.id)}
				</div>`;
			}
			function inspectorHTML() {
				const l = L();
				const c = l.c;
				const s = SRC.find((x) => x.id === state.sel) || SRC[0];
				const d = s[state.lang];
				const on = state.on[s.id];
				const isAuto = s.kind === "auto";
				const body = isAuto
					? `<div>
							<div class="editor-label"><span>${esc(c.autoLabel)}</span></div>
							<div class="preview-mini">${esc(c.autoPreview(d.name))}</div>
							<p class="ins-auto-note">${esc(c.autoNote)}</p>
							<button class="ghost" style="margin-top: 10px">${esc(l.btn.replace)}</button>
						</div>`
					: `<div>
							<div class="editor-label"><span>${esc(d.editTitle)}</span><em>${esc(c.emptyHint)}</em></div>
							<textarea spellcheck="false" style="min-height: 132px">${esc(d.value || "")}</textarea>
							<div class="editor-foot"><span>${esc(c.saved)}</span><span class="spacer"></span><button class="link">${esc(
								l.btn.reset,
							)}</button></div>
						</div>`;
				return `<span class="ins-eyebrow">${esc(c.insEyebrow)}</span>
					<h4>${esc(d.name)}</h4>
					<p class="ins-desc">${esc(d.desc)}</p>
					<div class="ins-meta">
						<span class="meta-pill">${esc(isAuto ? c.kindAuto : c.kindYours)}</span>
						<span class="meta-pill">≈${s.weight} tokens</span>
						<span class="meta-pill${on ? " on" : ""}">${esc(on ? c.stateOn : c.stateOff)}</span>
					</div>
					<div class="ins-divider"></div>
					${body}`;
			}
			function schemeC() {
				const l = L();
				const c = l.c;
				return `<section class="scheme${state.scheme === "c" ? " on" : ""}" data-scheme="c">
					<div class="scheme-head"><h2><span class="num">C</span>${esc(c.title)}</h2><p>${esc(c.lead)}</p></div>
					<div class="mock">
						${mockBarHTML()}
						<div class="mock-body wide">
							${navHTML(true)}
							<div class="pane">
								${paneHeadHTML(c.h3, c.paneLead, `<button class="ghost">${esc(l.common.full)}</button>`)}
								<div class="total-bar">
									<span>${esc(c.willSend)}</span><b data-blocks>${esc(l.blocksTpl(onCount()))}</b>
									<span class="spacer"></span>
									<span>${esc(l.totalLabel)} <b>≈4.5k</b> tokens</span>
								</div>
								<div class="recipe">${SRC.map(segHTML).join("")}</div>
								<p style="font-size: 11.5px; color: var(--faint)">${esc(c.dragHint)}</p>
							</div>
							<aside class="inspector">${inspectorHTML()}</aside>
						</div>
					</div>
					<div class="notes">${notesHTML("c")}</div>
				</section>`;
			}

			/* ---------- 说明 / 多语言约定 ---------- */
			function notesHTML(id) {
				return L()
					.notes[id].map((n) => `<div class="note"><span class="label">${esc(n.label)}</span><ul>${n.items.map((i) => `<li>${i}</li>`).join("")}</ul></div>`)
					.join("");
			}
			function policyHTML() {
				const byLang = {
					zh: {
						title: "多语言落地约定",
						sub: "15 个 locale（zh / en + locales/*.json）共用同一套键",
						items: [
							{
								h: "每段四个键",
								p: "<code>&lt;id&gt;_name</code> / <code>_desc</code> / <code>_editTitle</code> / <code>_editHint</code>，与现有 <code>promptTok_*</code> 一一对应，缺一个就报错（i18n-catalog 已有守卫）。",
							},
							{
								h: "长度按最长语言留位",
								p: "名字列 <code>nowrap</code>、说明列 <code>ellipsis</code>；编辑框小标题允许换行。英文比中文长约 1.4×，德语更长，别用固定宽度兜底。",
							},
							{
								h: "技术标识不进文案",
								p: "<code>{{token}}</code> 只留在服务端与「高级」折叠区，UI 文案里不出现——否则翻译会把它改坏。",
							},
						],
					},
					en: {
						title: "i18n contract",
						sub: "15 locales (zh / en + locales/*.json) share one key set",
						items: [
							{
								h: "Four keys per block",
								p: "<code>&lt;id&gt;_name</code> / <code>_desc</code> / <code>_editTitle</code> / <code>_editHint</code>, matching today's <code>promptTok_*</code>; a missing key fails the catalog check.",
							},
							{
								h: "Size for the longest language",
								p: "Name column <code>nowrap</code>, description <code>ellipsis</code>, editor titles may wrap. English runs ~1.4× Chinese, German longer — no fixed widths.",
							},
							{
								h: "No technical tokens in copy",
								p: "<code>{{token}}</code> stays in the server and the “Advanced” disclosure; translators can't break what they never see.",
							},
						],
					},
					ja: {
						title: "多言語の取り決め",
						sub: "15 ロケール（zh / en + locales/*.json）で同じキー集合を共有",
						items: [
							{
								h: "1 段落 4 キー",
								p: "<code>&lt;id&gt;_name</code> / <code>_desc</code> / <code>_editTitle</code> / <code>_editHint</code>。既存 <code>promptTok_*</code> と対応し、欠けると検査で落ちる。",
							},
							{
								h: "最長言語に合わせる",
								p: "名前は <code>nowrap</code>、説明は <code>ellipsis</code>、小見出しは折り返し可。英語は中国語の約 1.4 倍。",
							},
							{
								h: "技術表記は文案に入れない",
								p: "<code>{{token}}</code> はサーバーと「詳細」だけに置く。",
							},
						],
					},
				};
				const p = byLang[state.lang];
				return `<div class="policy-head"><h3>${esc(p.title)}</h3><span>${esc(p.sub)}</span></div>
					<div class="policy-grid">${p.items.map((i) => `<div><h4>${esc(i.h)}</h4><p>${i.p}</p></div>`).join("")}</div>`;
			}

			/* ---------- 渲染与交互 ---------- */
			function render() {
				document.documentElement.lang = state.lang === "zh" ? "zh-CN" : state.lang;
				document.title = L().docTitle;
				document.getElementById("showHead").innerHTML = headHTML();
				document.getElementById("tabs").innerHTML = tabsHTML();
				document.getElementById("langs").innerHTML = langsHTML();
				document.getElementById("schemes").innerHTML = schemeA() + schemeB() + schemeC();
				document.getElementById("policy").innerHTML = policyHTML();
			}

			function refreshCounts() {
				const l = L();
				document.querySelectorAll("[data-count]").forEach((el) => (el.textContent = l.countTpl(onCount(), SRC.length)));
				document.querySelectorAll("[data-blocks]").forEach((el) => (el.textContent = l.blocksTpl(onCount())));
			}

			document.addEventListener("click", (e) => {
				const tab = e.target.closest("[data-tab]");
				if (tab) {
					state.scheme = tab.dataset.tab;
					render();
					return;
				}
				const lang = e.target.closest("[data-lang]");
				if (lang) {
					state.lang = lang.dataset.lang;
					render();
					return;
				}
				const sw = e.target.closest(".sw");
				if (sw) {
					e.stopPropagation();
					const id = sw.dataset.id;
					state.on[id] = !state.on[id];
					sw.setAttribute("aria-checked", String(state.on[id]));
					const host = sw.closest(".entry, .pcard, .seg");
					if (host) host.classList.toggle("off", !state.on[id]);
					const bar = host && host.querySelector(".bar > i");
					if (bar) bar.style.width = (state.on[id] ? (SRC.find((s) => s.id === id).w) : 2) + "%";
					refreshCounts();
					if (state.scheme === "c") document.querySelector(".inspector").innerHTML = inspectorHTML();
					return;
				}
				const rowMain = e.target.closest(".row-main");
				if (rowMain) {
					const entry = rowMain.closest(".entry");
					const open = entry.classList.toggle("open");
					if (open) state.open.add(entry.dataset.id);
					else state.open.delete(entry.dataset.id);
					return;
				}
				const seg = e.target.closest(".seg");
				if (seg) {
					state.sel = seg.dataset.id;
					document.querySelectorAll(".scheme.on .seg").forEach((s) => s.classList.toggle("sel", s === seg));
					document.querySelector(".inspector").innerHTML = inspectorHTML();
				}
			});

			render();
		</script>
	</body>
</html>
